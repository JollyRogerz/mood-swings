name: Game verification
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: game-verification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodtest
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: moodtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moodtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://moodtest:ci-only-password@127.0.0.1:5432/moodtest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Start production server and test browser flows
        shell: bash
        run: |
          # Accounts run against in-memory stores here; production uses Postgres.
          MOOD_ACCOUNTS=memory npm start > /tmp/mood-swings-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat /tmp/mood-swings-server.log
            exit 1
          fi
          npm run test:e2e -- --max-failures=1
      - name: Keep the browser traces from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: output/playwright/test-results
          retention-days: 7
